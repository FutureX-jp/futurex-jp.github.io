<style>
/* ニセSNS（黒地）。夫婦の愚痴を投稿すると、リプ欄で全国の夫と妻が全面戦争になる */
:root{
  --bg:#000; --bg-2:#16181C; --line:#2F3336; --text:#E7E9EA; --sub:#71767B;
  --blue:#1D9BF0; --pink:#F91880; --green:#00BA7C; --fire:#FF7A00; --fire-2:#FFB000;
  --sheet:#FFFFFF; --sheet-text:#0F1419; --sheet-sub:#536471; --sheet-line:#EFF3F4;
  --f:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--text)}
body{font-family:var(--f);font-size:13.5px;line-height:1.45;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:600px;margin:0 auto;min-height:100%;border-inline:1px solid var(--line);position:relative;padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ヘッダー */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:14px;height:52px}
.top-row h1{font-size:17px;font-weight:800;margin:0;flex:1}
.top-row .flame{width:22px;height:22px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.icon-btn:hover{background:var(--bg-2)}
.tabs{display:grid;grid-template-columns:1fr 1fr}
.tabs button{height:48px;color:var(--sub);font-weight:700;position:relative}
.tabs button[aria-selected="true"]{color:var(--text)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:56px;height:4px;border-radius:2px;background:var(--blue)}
.reply{cursor:pointer}
.reply .hint-tap{display:none}
.mine-rp{background:#0b1a24}
.battle-tag{font-size:11px;color:var(--fire);margin-left:4px;white-space:nowrap;flex:none}
.dm-head{display:flex;align-items:center;gap:8px;padding-block:8px;border-bottom:1px solid var(--line);font-size:16px}
.thread{display:grid;gap:10px;padding-block:14px}
.bubble{justify-self:start;max-width:80%;background:var(--bg-2);border-radius:18px 18px 18px 4px;padding:9px 14px}
.bubble p{margin:0;overflow-wrap:anywhere}.bubble small{color:var(--sub);font-size:11px}
#b-txt{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--sheet-text);font-size:20px;line-height:1.4;min-height:24vh}
.battle{margin:6px 0;border-block:2px solid var(--fire);background:linear-gradient(180deg,rgba(255,122,0,.07),transparent 60%)}
.battle-head{display:flex;align-items:center;gap:6px;padding-block:8px;font-weight:800;color:var(--fire);font-size:14px}
.battle-head small{color:var(--sub);font-weight:400;margin-left:auto}
.battle .post{position:relative;border-bottom:0}
.battle .post:not(:last-of-type)::before{content:"";position:absolute;left:calc(max(16px,env(safe-area-inset-left,0px)) + 15px);top:42px;bottom:-4px;width:2px;background:#3a3f44}
.battle-head{cursor:pointer;user-select:none}
.battle-head .fold-ic{color:var(--sub);font-weight:400;font-size:12px;margin-left:6px}
.battle-more{display:block;width:100%;background:none;border:0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);color:var(--blue,#1D9BF0);font-size:13px;padding:8px 0;cursor:pointer}
.battle-more[hidden]{display:none}
.battle.fold .post.old{display:none}
.battle .post{grid-template-columns:32px 1fr;gap:10px;padding-block:7px}
.battle .av{width:32px;height:32px;font-size:13px}
.battle .acts,.battle .to{display:none}
.battle .post .text,.battle .post p{margin:2px 0 0}
.battle-result{padding-block:10px;font-weight:800;text-align:center;border-top:1px dashed var(--line)}
.battle-result.win{color:var(--green)}.battle-result.lose{color:var(--pink)}
.newpill{position:fixed;z-index:12;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--blue);color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:8px 16px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.hint{font-size:13px;color:var(--sub);padding-block:12px;border-bottom:1px solid var(--line)}
.hint b{color:var(--text)}

/* 投稿 */
.post{display:grid;grid-template-columns:36px 1fr;gap:10px;padding-block:10px;border-bottom:1px solid var(--line);cursor:pointer}
.post:hover{background:#080808}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
.post .body{min-width:0}
.meta{display:flex;gap:4px;align-items:baseline;font-size:13px;min-width:0}
.meta b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}
.meta span{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt{margin:2px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.big .txt{font-size:18px;line-height:1.35;margin:8px 0 10px}
.acts{display:flex;justify-content:space-between;max-width:430px;color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.acts span{display:inline-flex;align-items:center;gap:5px}
.acts svg{width:16px;height:16px;flex:none}
.acts .rt.on{color:var(--green)} .acts .lk.on{color:var(--pink)} .acts .lk.on svg{fill:currentColor}
.acts .rt,.acts .lk{cursor:pointer;border-radius:999px;padding:2px 4px;margin:-2px -4px}
.acts .hot{animation:bump .25s ease-out}
@keyframes bump{50%{transform:scale(1.18)}}
.meta .camp{flex:none;font-size:10px;font-weight:800;border-radius:4px;padding:0 5px;color:#fff;white-space:nowrap;align-self:center;overflow:visible}
.meta .camp.w{background:#F91880}.meta .camp.h{background:#1D9BF0}.meta .camp.n{background:#536471}
.to{font-size:12px;color:var(--sub);margin-top:1px}.to b{color:var(--blue);font-weight:400}
.me-pick{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--sheet-sub);margin:0 0 8px}
.me-pick button{border:1px solid #CFD9DE;border-radius:999px;padding:3px 12px;font-weight:700;color:var(--sheet-text)}
.me-pick button[aria-pressed="true"].w{background:#F91880;border-color:#F91880;color:#fff}
.me-pick button[aria-pressed="true"].h{background:#1D9BF0;border-color:#1D9BF0;color:#fff}
.mine-tag{font-size:11px;color:var(--fire);border:1px solid var(--fire);border-radius:999px;padding:0 6px;margin-left:4px}

/* 詳細 */
.detail .post{cursor:default;grid-template-columns:40px 1fr}
.burn{display:flex;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--line);font-weight:800}
.burn small{color:var(--sub);font-weight:400}
.burn .flame{width:18px;height:18px;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.15) rotate(4deg)}}
.heat{height:4px;background:var(--bg-2)}
.neta{margin:6px 12px 10px;padding:12px 14px;border:1px solid #3a3f47;border-radius:14px;background:#15181c;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.5;color:#c9ced6}.neta b{color:#fff;font-size:14px}.neta-q{background:#0d0f12;border-radius:10px;padding:8px 10px}.neta-q small{color:#8b929c;font-size:11.5px}.neta-q p{margin:2px 0 0;color:#e7e9ea;word-break:break-all}.neta-b{display:flex;gap:8px}.neta-b button{flex:1;border-radius:999px;padding:9px 10px;font-weight:800;font-size:13px;border:1px solid #3a3f47;background:transparent;color:#c9ced6}.neta-b .neta-yes{flex:1.6;border:0;background:linear-gradient(135deg,#FF394B,#FF7A00);color:#fff}.neta-b button:disabled{opacity:.6}
.heat i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fire-2),var(--fire),var(--pink));transition:width .4s}
.reply{animation:drop .3s ease-out both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.reply .acts{max-width:300px}
.ad{grid-template-columns:36px 1fr;cursor:default}
.ad .av{font-size:11px;letter-spacing:-.5px}
.ad .pr{flex:none;font-size:10px;font-weight:800;border:1px solid var(--sub);color:var(--sub);border-radius:4px;padding:0 4px;align-self:center}
.ad-card{display:block;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:6px 0 4px;color:inherit;text-decoration:none}
.ad-card .ad-img{height:96px;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,#1b2a3a,#2a1b2e)}
.ad-card .ad-t{padding:7px 10px 2px;font-size:13px;font-weight:700}
.ad-card .ad-d{padding:0 10px 8px;font-size:11.5px;color:var(--sub)}
.ad-btns{display:flex;gap:6px;margin:6px 0 2px}
.ad-btns a{flex:1;text-align:center;font-size:12.5px;font-weight:800;border-radius:999px;padding:7px 0;text-decoration:none;color:#000;background:#E7E9EA}
.ad-btns a.rk{background:#BF0000;color:#fff}
.ad-foot{font-size:11px;color:var(--sub);margin-top:4px;display:flex;gap:8px;align-items:center}.ad-foot span{white-space:nowrap;flex:none}
.ad-foot small{font-size:9.5px;opacity:.8}
.qt{border:1px solid var(--line);border-radius:12px;padding:7px 10px;margin:5px 0 7px;font-size:12.5px;color:var(--sub);overflow-wrap:anywhere}
.qt b{color:var(--text)}

/* 炎上の演出 */
.glow{position:fixed;inset:auto 0 0 0;height:38vh;pointer-events:none;z-index:1;background:radial-gradient(120% 90% at 50% 120%,rgba(255,122,0,.42),rgba(249,24,128,.12) 45%,transparent 70%);opacity:0;transition:opacity 1.2s}
.glow.on{opacity:1;animation:breathe 1.6s ease-in-out infinite alternate}
@keyframes breathe{from{filter:brightness(.85)}to{filter:brightness(1.25)}}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:30;display:grid;gap:6px;justify-items:center;pointer-events:none;padding-inline:16px}
.toast{background:var(--blue);color:#fff;font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:tin .3s ease-out both,tout .4s ease-in 2.6s forwards;max-width:100%;text-align:center}
.toast.f{background:linear-gradient(90deg,var(--fire),var(--pink))}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}

/* 下のメニュー */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#000;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:54px;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{display:grid;place-items:center;position:relative;color:var(--text)}
.nav svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] svg{stroke-width:2.6;fill:rgba(29,155,240,.18)}
.nav button[aria-current="page"]::after{content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--blue)}
.nav button:focus{outline:none}.nav button:focus-visible{outline:2px solid var(--blue);outline-offset:-4px}
.dm-sum{color:var(--sub);font-size:13px;padding-block:10px;border-bottom:1px solid var(--line)}
.dm-sum b{color:var(--text)}
.dm-n{margin-left:auto;background:var(--blue);color:#fff;font-size:12px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;flex:none;align-self:center}
.badge{position:absolute;top:6px;left:calc(50% + 4px);background:var(--blue);color:#fff;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;border:2px solid #000;font-variant-numeric:tabular-nums}
.badge.pinkb{background:var(--pink)}
.fab{position:fixed;z-index:11;right:max(16px,calc(50% - 300px + 16px),env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(29,155,240,.45)}
.fab svg{width:26px;height:26px}

/* 通知・DM・トレンド */
.row-item{display:grid;grid-template-columns:32px 1fr;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);animation:drop .3s ease-out both}
.row-item .ic{width:32px;height:32px;display:grid;place-items:center}
.row-item p{margin:0;overflow-wrap:anywhere}
.row-item small{color:var(--sub)}
.dm{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.dm.fresh{animation:drop .3s ease-out both}
.dm .av{width:44px;height:44px}
.dm p{margin:2px 0 0;color:var(--sub);overflow-wrap:anywhere}
.dm b{color:var(--text)}
.dm .unread{color:var(--text);font-weight:700}
.trend{padding-block:10px;border-bottom:1px solid var(--line)}
.trend small{color:var(--sub);display:block;font-size:12px}
.trend b{display:block;font-size:15px;overflow-wrap:anywhere}
.trend.mine b{color:var(--fire)}
.empty{color:var(--sub);text-align:center;padding:40px 16px;font-size:14px}
.rank-n{font-size:22px;font-weight:900;color:var(--sub);width:40px;text-align:center;align-self:center;font-variant-numeric:tabular-nums}
.rank-n.top{color:var(--fire)}

/* 投稿画面（白いシート） */
/* ===== バトル演出（画面いっぱい） ===== */
.fx{position:fixed;inset:0;z-index:80;overflow:hidden;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fx .bg{position:absolute;inset:-80%;animation:fxbg .5s ease-out both}
.fx.start .bg{background:repeating-conic-gradient(from 0deg,#ff2d55 0 8deg,#ff7a00 8deg 16deg);animation:fxspin 6s linear infinite,fxbg .35s ease-out both}
.fx.start .dim{position:absolute;inset:0;background:radial-gradient(circle,rgba(0,0,0,0) 20%,rgba(0,0,0,.75) 75%)}
.fx .vs{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;width:min(92vw,520px)}
.fx .side{display:grid;justify-items:center;gap:8px;color:#fff;font-weight:900;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.6);font-size:15px;text-align:center}
.fx .side .av{width:84px;height:84px;font-size:34px;border:4px solid #fff;box-shadow:0 0 0 4px #000,0 0 30px rgba(255,255,255,.6)}
.fx .side.l{animation:fxinL .45s cubic-bezier(.2,1.6,.4,1) both}.fx .side.r{animation:fxinR .45s cubic-bezier(.2,1.6,.4,1) both}
.fx .vsT{font:900 64px/1 Impact,"Arial Black",sans-serif;color:#ffe600;-webkit-text-stroke:3px #000;text-shadow:0 0 24px #ff0,6px 6px 0 #000;animation:fxpop .5s .3s cubic-bezier(.2,1.8,.4,1) both;font-style:italic}
.fx .big{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-weight:900;font-size:clamp(38px,11vw,68px);color:#ffe600;-webkit-text-stroke:2px #000;text-shadow:0 0 18px rgba(255,230,0,.8),5px 5px 0 #000;background:linear-gradient(90deg,transparent,rgba(0,0,0,.7) 15%,rgba(0,0,0,.7) 85%,transparent);padding:10px 0;letter-spacing:.04em;animation:fxslam .5s .55s cubic-bezier(.2,1.6,.4,1) both;transform-origin:center}
.fx .sub{position:absolute;left:16px;right:16px;bottom:9%;text-align:center;color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 0 #000;animation:fxbg .3s .8s both}
.fx .flash{position:absolute;inset:0;background:#fff;animation:fxflash .45s ease-out both;pointer-events:none}
.fx .slash{position:absolute;left:-10%;right:-10%;top:50%;height:10px;background:#fff;box-shadow:0 0 30px #fff,0 0 60px #ff0;transform:rotate(-14deg) scaleX(0);animation:fxslash .35s .2s ease-out both}
.fx.round .bg{background:linear-gradient(135deg,#1d0b2e,#ff2d55 60%,#ff7a00)}
.fx.round .big{bottom:auto;top:40%;font-size:clamp(44px,14vw,88px);font-family:Impact,"Arial Black",sans-serif;font-style:italic;color:#ffe600;animation:fxslam .4s cubic-bezier(.2,1.6,.4,1) both}
.fx.round .sub{bottom:auto;top:calc(40% + clamp(54px,16vw,100px))}
.fx.win .bg{background:repeating-conic-gradient(from 0deg,#ffd400 0 10deg,#ff9500 10deg 20deg);animation:fxspin 8s linear infinite,fxbg .3s both}
.fx.peace .bg{background:repeating-conic-gradient(from 0deg,#ff8fb1 0 10deg,#7ee0b5 10deg 20deg);animation:fxspin 10s linear infinite,fxbg .3s both}
.fx.lose .bg{background:radial-gradient(circle at 50% 45%,#5a0010,#0a0003 70%);animation:fxbg .3s both}
.fx .res{position:relative;text-align:center;font-weight:900;line-height:1;color:#fff;-webkit-text-stroke:3px #000;font-size:clamp(56px,17vw,130px);white-space:nowrap;animation:fxpop .55s cubic-bezier(.2,1.9,.4,1) both}
.fx.win .res{color:#fff7b0;text-shadow:0 0 30px #fff,0 0 60px #ffd400,8px 8px 0 #000}
.fx.peace .res{color:#fff;text-shadow:0 0 30px #fff,8px 8px 0 #000}
.fx.lose .res{color:#ff2d55;text-shadow:6px 0 #00e5ff,-6px 0 #ff00aa,8px 8px 0 #000;animation:fxpop .5s cubic-bezier(.2,1.9,.4,1) both,fxglitch .25s .6s steps(2) 4}
.fx .res small{display:block;font-size:.22em;-webkit-text-stroke:0;color:#fff;text-shadow:0 2px 0 #000;margin-top:14px;letter-spacing:.1em}
.fx .crack{position:absolute;inset:0;pointer-events:none;opacity:.85;animation:fxbg .1s .15s both}
.fx .conf{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fxfall linear forwards}
.fx .tap{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:12px;font-weight:700;animation:fxblink 1s 1s infinite both}
.shake{animation:fxshake .4s linear}
@keyframes fxbg{from{opacity:0}to{opacity:1}}
@keyframes fxspin{to{transform:rotate(360deg)}}
@keyframes fxinL{from{transform:translateX(-120vw) rotate(-20deg)}to{transform:none}}
@keyframes fxinR{from{transform:translateX(120vw) rotate(20deg)}to{transform:none}}
@keyframes fxpop{0%{transform:scale(4);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
