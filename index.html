<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>フカシGames</title>
<meta name="description" content="ゲームまで、ちょっと盛る。個人制作のバカゲー集「フカシGames」">
<meta name="theme-color" content="#07151A">
<meta property="og:title" content="フカシGames"><meta property="og:description" content="ゲームまで、ちょっと盛る。"><meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<!-- フカシGames の入口（ハブ）。デザインは ChatGPT 案「盛りすぎゲーム棚」2026-09-26。ゲームを足す時は下の GAMES に1行足すだけ -->
<style>
:root{--bg:#0D3B36;--bg2:#07151A;--lime:#DFFF24;--ink:#111;--paper:#F5F7EF;--ui:'M PLUS Rounded 1c',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg2);color:var(--paper);font-family:var(--ui);overflow-x:hidden;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
.wrap{max-width:430px;margin:0 auto;background:var(--bg);min-height:100dvh;overflow:hidden}
header{position:relative;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 26px) 16px 22px;background:radial-gradient(120% 90% at 50% 0%,#16574f 0%,var(--bg) 70%)}
header .lab{display:inline-block;font:800 10px/1 var(--ui);letter-spacing:.2em;color:var(--lime);border:1.5px solid rgba(223,255,36,.55);background:rgba(7,21,26,.6);border-radius:999px;padding:5px 10px}
h1{margin:12px 0 0;font:900 54px/1 var(--ui);letter-spacing:-.04em;transform:rotate(-4deg);white-space:nowrap}
h1 .f{color:var(--lime);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 #111,-2px 2px 0 #111,2px -2px 0 #111,-2px -2px 0 #111,0 5px 0 #111,0 9px 0 #4a1238,0 14px 16px rgba(0,0,0,.6)}
h1 .g{display:inline-block;font-size:30px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 #111;margin-left:4px;transform:translateY(-4px)}
.tag{margin-top:16px;font:800 16px/1.3 var(--ui);text-shadow:0 2px 0 #111}
.tag em{font-style:normal;color:var(--lime)}
.deco{position:absolute;font:900 22px/1 var(--ui);color:rgba(223,255,36,.5);pointer-events:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-6px) rotate(var(--r))}}
.sec{display:flex;align-items:center;gap:8px;margin:6px 16px 10px;font:900 13px/1 var(--ui);letter-spacing:.25em;color:var(--lime)}
.sec::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,rgba(223,255,36,.6) 0 8px,transparent 8px 14px)}
.list{display:grid;gap:14px;padding:0 16px 18px}
.card{position:relative;display:block;width:100%;min-height:158px;text-align:left;color:var(--paper);background:linear-gradient(135deg,color-mix(in srgb,var(--k) 16%,transparent),transparent 60%),var(--bg);border:4px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink),0 0 0 2px color-mix(in srgb,var(--k) 55%,transparent) inset,0 12px 18px rgba(0,0,0,.45);padding:14px 14px 14px 16px;cursor:pointer;overflow:hidden;font-family:var(--ui);text-decoration:none;transition:transform .12s,box-shadow .12s}
.card:active,.card.push{transform:translateY(4px) scale(.96);box-shadow:0 2px 0 var(--ink),0 0 0 2px color-mix(in srgb,var(--k) 55%,transparent) inset}
.card:focus-visible{outline:3px solid #fff;outline-offset:3px}
.card .tape{position:absolute;right:-34px;top:12px;width:130px;transform:rotate(35deg);background:repeating-linear-gradient(45deg,var(--k) 0 10px,var(--ink) 10px 20px);height:14px;opacity:.9}
.card .no{font:900 13px/1 var(--ui);color:var(--k);letter-spacing:.1em}
.card .badge{position:absolute;right:14px;top:34px;font:800 10px/1 var(--ui);color:var(--ink);background:var(--k);border:2px solid var(--ink);border-radius:6px;padding:4px 6px;transform:rotate(3deg)}
.card .ttl{margin-top:8px;font:900 28px/1.05 var(--ui);letter-spacing:-.02em;color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);max-width:62%}
.card .cc{margin-top:8px;font:800 12.5px/1.45 var(--ui);max-width:52%;opacity:.95}
.card .vis{position:absolute;right:8px;bottom:40px;display:flex;gap:0;font-size:44px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.card .vis span:nth-child(1){transform:rotate(-14deg) translateY(4px)} .card .vis span:nth-child(2){transform:rotate(8deg) translateY(-10px);margin-left:-10px} .card .vis span:nth-child(3){transform:rotate(-6deg) translateY(10px);margin-left:-14px;font-size:38px}
.card .play{position:absolute;right:12px;bottom:10px;font:900 13px/1 var(--ui);color:var(--ink);background:var(--k);border:2px solid var(--ink);border-radius:999px;padding:5px 10px;box-shadow:0 2px 0 var(--ink)}
.card.soon{--k:#8c9a95;background:#101F22;border-style:dashed;cursor:default;box-shadow:0 6px 0 var(--ink)}
.card.soon .ttl{color:#c9d2cf} .card.soon .q{position:absolute;right:26px;top:50%;transform:translateY(-50%) rotate(8deg);font:900 88px/1 var(--ui);color:rgba(201,210,207,.35);-webkit-text-stroke:2px var(--ink)}
.notice{margin-top:6px;padding:20px 16px 22px;text-align:center;background:var(--bg2);background-image:repeating-linear-gradient(-45deg,rgba(223,255,36,.06) 0 12px,transparent 12px 24px)}
.notice b{display:block;font:900 20px/1.2 var(--ui)} .notice small{display:inline-block;margin-top:8px;font:800 11px/1 var(--ui);letter-spacing:.2em;color:var(--lime)}
footer{padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center;background:var(--bg2);font:500 11px/1.8 var(--ui);color:rgba(245,247,239,.6)} footer b{color:var(--lime)}
#wipe{position:fixed;inset:0;z-index:50;pointer-events:none;display:grid;place-items:center;visibility:hidden}
#wipe .st{position:absolute;inset:-20% -60%;background:repeating-linear-gradient(-60deg,var(--k) 0 26px,var(--ink) 26px 52px);transform:translateX(-120%)}
#wipe .t{position:relative;font:900 40px/1 var(--ui);color:#fff;-webkit-text-stroke:2px #111;paint-order:stroke fill;text-shadow:0 4px 0 #111;opacity:0;transform:scale(1.6) rotate(-4deg)}
#wipe.go{visibility:visible} #wipe.go .st{animation:wp .34s cubic-bezier(.3,.8,.4,1) forwards} #wipe.go .t{animation:wt .3s .12s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes wp{to{transform:translateX(0)}} @keyframes wt{to{opacity:1;transform:scale(1) rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.deco{animation:none} #wipe.go .st,#wipe.go .t{animation-duration:.01s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="deco" style="left:18px;top:34px;--r:-12deg">!?</span><span class="deco" style="right:22px;top:40px;--r:10deg;animation-delay:.6s">★</span><span class="deco" style="left:36px;bottom:18px;--r:8deg;animation-delay:1.1s">⚡</span><span class="deco" style="right:40px;bottom:22px;--r:-8deg;animation-delay:.3s">!!</span>
    <span class="lab">個人制作ゲーム集</span>
    <h1><span class="f">フカシ</span><span class="g">Games</span></h1>
    <div class="tag">ゲームまで、<em>ちょっと盛る。</em></div>
  </header>
  <div class="sec">PLAY</div>
  <div class="list" id="list"></div>
  <div class="notice"><b>フカシ、まだ増えます。</b><small>NEXT GAME →</small></div>
  <footer>© FUKASHI Games ／ FutureX<br><b>盛ってます。</b></footer>
</div>
<div id="wipe"><div class="st"></div><div class="t"></div></div>
<script>
// ===== ゲーム一覧：新しいフカシゲームはここに1行足す（url が空なら「近日公開」カード）=====
const GAMES=[
  {id:'pk', title:'フカシPK', catch:'キーパーが強すぎる。それでも蹴る。', key:'#DFFF24', vis:['⚽','🧤','💥'], badge:'PK・バカゲー', url:'https://futurex-jp.github.io/fukashi-pk/'},
];
const SOON=['次のフカシ、仕込み中。','まだタイトルすら盛ってません。','近日公開。たぶんヤバい。','近日、盛ります。','COMING SOON 何かをフカします。'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){ const L=document.getElementById('list'); let h='';
  GAMES.forEach((g,i)=>{ const no=String(i+1).padStart(2,'0');
    if(!g.url){ h+=`<div class="card soon" aria-disabled="true" style="--k:${esc(g.key)}"><div class="no">${no}</div><span class="badge">近日公開</span><div class="ttl">${esc(g.title)}</div><div class="cc">${esc(g.catch)}</div><span class="q">？</span></div>`; return; }   // url が空＝まだ遊べない（押せない近日公開カード）
    h+=`<a class="card" href="${esc(g.url)}" data-i="${i}" style="--k:${esc(g.key)}" aria-label="${esc(g.title)}をあそぶ"><span class="tape"></span><div class="no">${no}</div><span class="badge">${esc(g.badge)}</span><div class="ttl">${esc(g.title)}</div><div class="cc">${esc(g.catch)}</div><div class="vis">${g.vis.map(v=>`<span>${v}</span>`).join('')}</div><span class="play">PLAY →</span></a>`; });
  const no=String(GAMES.length+1).padStart(2,'0'), t=SOON[(new Date().getDate())%SOON.length];
  h+=`<div class="card soon" aria-disabled="true"><div class="no">${no}</div><div class="ttl">？？？</div><div class="cc">${esc(t)}</div><span class="q">？</span></div>`;
  L.innerHTML=h; }
render();
// 押す → 沈む → キーカラーの斜めストライプが横切る → タイトル → 遷移（戻ってきた時に残らないよう pageshow で消す）
document.getElementById('list').addEventListener('click',e=>{ const a=e.target.closest('a.card'); if(!a) return; e.preventDefault(); const g=GAMES[+a.dataset.i]; if(!g||!g.url) return;
  a.classList.add('push'); const w=document.getElementById('wipe'); w.style.setProperty('--k',g.key); w.querySelector('.t').textContent=g.title;
  setTimeout(()=>{ w.classList.remove('go'); void w.offsetWidth; w.classList.add('go'); },110);
  setTimeout(()=>{ location.href=g.url; },480); });
addEventListener('pageshow',()=>{ document.getElementById('wipe').classList.remove('go'); document.querySelectorAll('.card.push').forEach(c=>c.classList.remove('push')); });
</script>
</body>
</html>
